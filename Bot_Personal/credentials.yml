# This file contains the credentials for the voice & chat platforms
# which your bot is using.
# https://rasa.com/docs/rasa/messaging-and-voice-channels

rest:
#  # you don't need to provide anything here - this channel doesn't
#  # require any credentials

# Telegram connector
# Completa estos campos antes de ejecutar con Telegram
telegram:
  # Token del bot de Telegram (desde BotFather)
  access_token: "<TU_TOKEN_DE_TELEGRAM>"
  # Usuario del bot SIN @ (por ejemplo: MiBot123_bot)
  verify: "<TU_USUARIO_DE_BOT>"
  # URL pública a tu instancia de Rasa (por ej. ngrok)
  # Formato: https://<DOMINIO>/webhooks/telegram/webhook
  webhook_url: "https://<TU_DOMINIO_PUBLICO>/webhooks/telegram/webhook"
  

#facebook:
#  verify: "<verify>"
#  secret: "<your secret>"
#  page-access-token: "<your page access token>"

#slack:
#  slack_token: "<your slack token>"
#  slack_channel: "<the slack channel>"
#  slack_signing_secret: "<your slack signing secret>"

#socketio:
#  user_message_evt: <event name for user message>
#  bot_message_evt: <event name for bot messages>
#  session_persistence: <true/false>

#mattermost:
#  url: "https://<mattermost instance>/api/v4"
#  token: "<bot token>"
